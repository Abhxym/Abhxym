      <stop offset="0" stop-color="#e9e9e9"/><stop offset=".55" stop-color="#bdbdbd"/><stop offset="1" stop-color="#8c8c8c"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="1" x2="0" y2="0">
