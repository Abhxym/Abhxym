<svg xmlns="http://www.w3.org/2000/svg" width="440" height="236" viewBox="0 0 440 236" role="img" aria-label="InsightFlow: Survey analytics where non-technical users ask questions in plain English and get cited answers.">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#10b981" stop-opacity=".28"/><stop offset=".6" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect width="440" height="236" rx="18"/></clipPath>
    <style>
      .cat{font:700 10.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;letter-spacing:1.6px;fill:#10b981}
      .title{font:800 25px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#f8fafc}
      .desc{font:400 13.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#a8b3c7}
      .hl{font:600 12px 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;fill:#06b6d4}
      .chip{fill:#ffffff0d;stroke:#ffffff1f;stroke-width:1}
      .chipt{font:600 11.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#dbe3ef}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="440" height="236" fill="#0b1020"/>
    <rect width="440" height="236" fill="url(#glow)"/>
    <rect width="5" height="236" fill="url(#acc)"/>
  </g>
  <rect x=".5" y=".5" width="439" height="235" rx="17.5" fill="none" stroke="#ffffff1a"/>
  <text x="28" y="38" class="cat">NLP · RAG ANALYTICS</text>
  
  <text x="28" y="74" class="title">InsightFlow</text>
  <text x="28" y="104" class="desc">Survey analytics where non-technical users ask questions</text><text x="28" y="124" class="desc">in plain English and get cited answers.</text>
  <text x="28" y="154" class="hl">▸ Themes + sentiment · RAG agent with citations</text>
  <rect x="28.0" y="194" width="63.4" height="24" rx="12" class="chip"/><text x="59.7" y="210.5" class="chipt" text-anchor="middle">Gemini</text><rect x="99.4" y="194" width="77.2" height="24" rx="12" class="chip"/><text x="138.0" y="210.5" class="chipt" text-anchor="middle">Pinecone</text><rect x="184.6" y="194" width="70.3" height="24" rx="12" class="chip"/><text x="219.8" y="210.5" class="chipt" text-anchor="middle">FastAPI</text><rect x="262.9" y="194" width="56.5" height="24" rx="12" class="chip"/><text x="291.2" y="210.5" class="chipt" text-anchor="middle">React</text><rect x="327.4" y="194" width="70.3" height="24" rx="12" class="chip"/><text x="362.6" y="210.5" class="chipt" text-anchor="middle">Node.js</text>
</svg>
