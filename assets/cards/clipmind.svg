<svg xmlns="http://www.w3.org/2000/svg" width="440" height="236" viewBox="0 0 440 236" role="img" aria-label="ClipMind AI: 13-agent LangGraph pipeline that turns raw video clips and a one-line brief into a captioned, platform-ready reel.">
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".08"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <style>
      .cat{font:700 11px 'Courier New', Consolas, 'Liberation Mono', monospace;letter-spacing:1.5px;fill:#a3a3a3}
      .title{font:800 25px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#ffffff}
      .desc{font:400 13.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#bdbdbd}
      .hl{font:700 12px 'Courier New', Consolas, 'Liberation Mono', monospace;fill:#ffffff}
      .chip{fill:#000;stroke:#ffffff55;stroke-width:1}
      .chipt{font:600 11.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#e5e5e5}
    </style>
  </defs>
  <rect x=".5" y=".5" width="439" height="235" rx="10" fill="#050505" stroke="#ffffff33"/>
  <rect x=".5" y=".5" width="439" height="235" rx="10" fill="url(#sheen)"/>
  <text x="28" y="38" class="cat">GENERATIVE AI · AGENTS</text>
  
  <text x="28" y="74" class="title">ClipMind AI</text>
  <text x="28" y="104" class="desc">13-agent LangGraph pipeline that turns raw video clips</text><text x="28" y="124" class="desc">and a one-line brief into a captioned, platform-ready</text><text x="28" y="144" class="desc">reel.</text>
  <text x="28" y="174" class="hl">&gt; RAG brand rules · review loop · live agent graph</text>
  <rect x="28.0" y="194" width="84.1" height="24" rx="4" class="chip"/><text x="70.0" y="210.5" class="chipt" text-anchor="middle">LangGraph</text><rect x="120.1" y="194" width="63.4" height="24" rx="4" class="chip"/><text x="151.8" y="210.5" class="chipt" text-anchor="middle">Gemini</text><rect x="191.5" y="194" width="70.3" height="24" rx="4" class="chip"/><text x="226.7" y="210.5" class="chipt" text-anchor="middle">Whisper</text><rect x="269.8" y="194" width="56.5" height="24" rx="4" class="chip"/><text x="298.1" y="210.5" class="chipt" text-anchor="middle">FAISS</text><rect x="334.3" y="194" width="63.4" height="24" rx="4" class="chip"/><text x="366.0" y="210.5" class="chipt" text-anchor="middle">FFmpeg</text>
</svg>
