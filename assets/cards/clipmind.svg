<svg xmlns="http://www.w3.org/2000/svg" width="440" height="236" viewBox="0 0 440 236" role="img" aria-label="ClipMind AI: 13-agent LangGraph pipeline that turns raw video clips and a one-line brief into a captioned, platform-ready reel.">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#a855f7" stop-opacity=".28"/><stop offset=".6" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect width="440" height="236" rx="18"/></clipPath>
    <style>
      .cat{font:700 10.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;letter-spacing:1.6px;fill:#a855f7}
      .title{font:800 25px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#f8fafc}
      .desc{font:400 13.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#a8b3c7}
      .hl{font:600 12px 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;fill:#f59e0b}
      .chip{fill:#ffffff0d;stroke:#ffffff1f;stroke-width:1}
      .chipt{font:600 11.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#dbe3ef}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="440" height="236" fill="#0b1020"/>
    <rect width="440" height="236" fill="url(#glow)"/>
    <rect width="5" height="236" fill="url(#acc)"/>
  </g>
  <rect x=".5" y=".5" width="439" height="235" rx="17.5" fill="none" stroke="#ffffff1a"/>
  <text x="28" y="38" class="cat">GENERATIVE AI · AGENTS</text>
  
  <text x="28" y="74" class="title">ClipMind AI</text>
  <text x="28" y="104" class="desc">13-agent LangGraph pipeline that turns raw video clips</text><text x="28" y="124" class="desc">and a one-line brief into a captioned, platform-ready</text><text x="28" y="144" class="desc">reel.</text>
  <text x="28" y="174" class="hl">▸ RAG brand rules · review loop · live agent graph</text>
  <rect x="28.0" y="194" width="84.1" height="24" rx="12" class="chip"/><text x="70.0" y="210.5" class="chipt" text-anchor="middle">LangGraph</text><rect x="120.1" y="194" width="63.4" height="24" rx="12" class="chip"/><text x="151.8" y="210.5" class="chipt" text-anchor="middle">Gemini</text><rect x="191.5" y="194" width="70.3" height="24" rx="12" class="chip"/><text x="226.7" y="210.5" class="chipt" text-anchor="middle">Whisper</text><rect x="269.8" y="194" width="56.5" height="24" rx="12" class="chip"/><text x="298.1" y="210.5" class="chipt" text-anchor="middle">FAISS</text><rect x="334.3" y="194" width="63.4" height="24" rx="12" class="chip"/><text x="366.0" y="210.5" class="chipt" text-anchor="middle">FFmpeg</text>
</svg>
