<svg xmlns="http://www.w3.org/2000/svg" width="440" height="236" viewBox="0 0 440 236" role="img" aria-label="Glaucoma AI: Multi-stage clinical decision support that screens retinal fundus images for glaucoma, with a dashboard for doctors.">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#3b82f6" stop-opacity=".28"/><stop offset=".6" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect width="440" height="236" rx="18"/></clipPath>
    <style>
      .cat{font:700 10.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;letter-spacing:1.6px;fill:#3b82f6}
      .title{font:800 25px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#f8fafc}
      .desc{font:400 13.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#a8b3c7}
      .hl{font:600 12px 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;fill:#a855f7}
      .chip{fill:#ffffff0d;stroke:#ffffff1f;stroke-width:1}
      .chipt{font:600 11.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#dbe3ef}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="440" height="236" fill="#0b1020"/>
    <rect width="440" height="236" fill="url(#glow)"/>
    <rect width="5" height="236" fill="url(#acc)"/>
  </g>
  <rect x=".5" y=".5" width="439" height="235" rx="17.5" fill="none" stroke="#ffffff1a"/>
  <text x="28" y="38" class="cat">MEDICAL IMAGING</text>
  
  <text x="28" y="74" class="title">Glaucoma AI</text>
  <text x="28" y="104" class="desc">Multi-stage clinical decision support that screens</text><text x="28" y="124" class="desc">retinal fundus images for glaucoma, with a dashboard for</text><text x="28" y="144" class="desc">doctors.</text>
  <text x="28" y="174" class="hl">▸ YOLOv8 → UNet++ / transformer → XGBoost</text>
  <rect x="28.0" y="194" width="70.3" height="24" rx="12" class="chip"/><text x="63.2" y="210.5" class="chipt" text-anchor="middle">PyTorch</text><rect x="106.3" y="194" width="63.4" height="24" rx="12" class="chip"/><text x="138.0" y="210.5" class="chipt" text-anchor="middle">YOLOv8</text><rect x="177.7" y="194" width="63.4" height="24" rx="12" class="chip"/><text x="209.4" y="210.5" class="chipt" text-anchor="middle">UNet++</text><rect x="249.1" y="194" width="70.3" height="24" rx="12" class="chip"/><text x="284.2" y="210.5" class="chipt" text-anchor="middle">XGBoost</text><rect x="327.4" y="194" width="70.3" height="24" rx="12" class="chip"/><text x="362.6" y="210.5" class="chipt" text-anchor="middle">Next.js</text>
</svg>
