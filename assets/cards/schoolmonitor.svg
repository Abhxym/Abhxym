<svg xmlns="http://www.w3.org/2000/svg" width="440" height="236" viewBox="0 0 440 236" role="img" aria-label="School Monitor: Monitoring system for 12 Zilla Parishad schools: attendance, events, reports, GR publishing and a public transparency page.">
  <defs>
    <!-- Same light-grey sky tones as the banner -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ececec"/><stop offset=".6" stop-color="#d4d4d4"/><stop offset="1" stop-color="#bdbdbd"/></linearGradient>
    <style>
      .cat{font:700 11px 'Courier New', Consolas, 'Liberation Mono', monospace;letter-spacing:1.5px;fill:#5c5c5c}
      .title{font:800 25px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#111111}
      .desc{font:400 13.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#333333}
      .hl{font:700 12px 'Courier New', Consolas, 'Liberation Mono', monospace;fill:#111111}
      .chip{fill:#f5f5f5;stroke:#11111140;stroke-width:1}
      .chipt{font:600 11.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#222222}
    </style>
  </defs>
  <rect x=".5" y=".5" width="439" height="235" rx="10" fill="url(#bg)" stroke="#00000033"/>
  <path d="M0 190 C 132 174 264 196 440 180 V226 Q440 236 430 236 H10 Q0 236 0 226Z" fill="#a8a8a8" opacity=".35"/>
  <text x="28" y="38" class="cat">FULL-STACK · GOV-TECH</text>
  <rect x="356" y="22" width="58" height="22" rx="4" fill="#111111" /><circle cx="368" cy="33" r="3.5" fill="#fff"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle><text x="394" y="37.5" text-anchor="middle" style="font:700 10.5px 'Courier New', Consolas, 'Liberation Mono', monospace;fill:#fff;letter-spacing:1px">LIVE</text>
  <text x="28" y="74" class="title">School Monitor</text>
  <text x="28" y="104" class="desc">Monitoring system for 12 Zilla Parishad schools:</text><text x="28" y="124" class="desc">attendance, events, reports, GR publishing and a public</text><text x="28" y="144" class="desc">transparency page.</text>
  <text x="28" y="174" class="hl">&gt; Role-based access · Google OAuth · deployed</text>
  <rect x="28.0" y="194" width="70.3" height="24" rx="4" class="chip"/><text x="63.2" y="210.5" class="chipt" text-anchor="middle">Next.js</text><rect x="106.3" y="194" width="70.3" height="24" rx="4" class="chip"/><text x="141.5" y="210.5" class="chipt" text-anchor="middle">Express</text><rect x="184.6" y="194" width="70.3" height="24" rx="4" class="chip"/><text x="219.8" y="210.5" class="chipt" text-anchor="middle">MongoDB</text><rect x="262.9" y="194" width="42.7" height="24" rx="4" class="chip"/><text x="284.3" y="210.5" class="chipt" text-anchor="middle">JWT</text>
</svg>
