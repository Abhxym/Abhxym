<svg xmlns="http://www.w3.org/2000/svg" width="440" height="236" viewBox="0 0 440 236" role="img" aria-label="SUPPLYCHAIN-X: Distributed platform that traces how a disaster cascades through global supply chains, hop by hop.">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#06b6d4" stop-opacity=".28"/><stop offset=".6" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect width="440" height="236" rx="18"/></clipPath>
    <style>
      .cat{font:700 10.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;letter-spacing:1.6px;fill:#06b6d4}
      .title{font:800 25px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#f8fafc}
      .desc{font:400 13.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#a8b3c7}
      .hl{font:600 12px 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;fill:#3b82f6}
      .chip{fill:#ffffff0d;stroke:#ffffff1f;stroke-width:1}
      .chipt{font:600 11.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#dbe3ef}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="440" height="236" fill="#0b1020"/>
    <rect width="440" height="236" fill="url(#glow)"/>
    <rect width="5" height="236" fill="url(#acc)"/>
  </g>
  <rect x=".5" y=".5" width="439" height="235" rx="17.5" fill="none" stroke="#ffffff1a"/>
  <text x="28" y="38" class="cat">BIG DATA · GRAPHS</text>
  
  <text x="28" y="74" class="title">SUPPLYCHAIN-X</text>
  <text x="28" y="104" class="desc">Distributed platform that traces how a disaster cascades</text><text x="28" y="124" class="desc">through global supply chains, hop by hop.</text>
  <text x="28" y="154" class="hl">▸ 48,827 disasters · 330k trade rows · Kafka live</text>
  <rect x="28.0" y="194" width="49.6" height="24" rx="12" class="chip"/><text x="52.8" y="210.5" class="chipt" text-anchor="middle">HDFS</text><rect x="85.6" y="194" width="56.5" height="24" rx="12" class="chip"/><text x="113.8" y="210.5" class="chipt" text-anchor="middle">Spark</text><rect x="150.1" y="194" width="56.5" height="24" rx="12" class="chip"/><text x="178.3" y="210.5" class="chipt" text-anchor="middle">Kafka</text><rect x="214.6" y="194" width="56.5" height="24" rx="12" class="chip"/><text x="242.8" y="210.5" class="chipt" text-anchor="middle">Neo4j</text><rect x="279.1" y="194" width="70.3" height="24" rx="12" class="chip"/><text x="314.2" y="210.5" class="chipt" text-anchor="middle">FastAPI</text><rect x="357.4" y="194" width="35.8" height="24" rx="12" class="chip"/><text x="375.3" y="210.5" class="chipt" text-anchor="middle">D3</text>
</svg>
