<svg xmlns="http://www.w3.org/2000/svg" width="440" height="236" viewBox="0 0 440 236" role="img" aria-label="SUPPLYCHAIN-X: Distributed platform that traces how a disaster cascades through global supply chains, hop by hop.">
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".08"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <style>
      .cat{font:700 11px 'Courier New', Consolas, 'Liberation Mono', monospace;letter-spacing:1.5px;fill:#a3a3a3}
      .title{font:800 25px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#ffffff}
      .desc{font:400 13.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#bdbdbd}
      .hl{font:700 12px 'Courier New', Consolas, 'Liberation Mono', monospace;fill:#ffffff}
      .chip{fill:#000;stroke:#ffffff55;stroke-width:1}
      .chipt{font:600 11.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#e5e5e5}
    </style>
  </defs>
  <rect x=".5" y=".5" width="439" height="235" rx="10" fill="#050505" stroke="#ffffff33"/>
  <rect x=".5" y=".5" width="439" height="235" rx="10" fill="url(#sheen)"/>
  <text x="28" y="38" class="cat">BIG DATA · GRAPHS</text>
  
  <text x="28" y="74" class="title">SUPPLYCHAIN-X</text>
  <text x="28" y="104" class="desc">Distributed platform that traces how a disaster cascades</text><text x="28" y="124" class="desc">through global supply chains, hop by hop.</text>
  <text x="28" y="154" class="hl">&gt; 48,827 disasters · 330k trade rows · Kafka live</text>
  <rect x="28.0" y="194" width="49.6" height="24" rx="4" class="chip"/><text x="52.8" y="210.5" class="chipt" text-anchor="middle">HDFS</text><rect x="85.6" y="194" width="56.5" height="24" rx="4" class="chip"/><text x="113.8" y="210.5" class="chipt" text-anchor="middle">Spark</text><rect x="150.1" y="194" width="56.5" height="24" rx="4" class="chip"/><text x="178.3" y="210.5" class="chipt" text-anchor="middle">Kafka</text><rect x="214.6" y="194" width="56.5" height="24" rx="4" class="chip"/><text x="242.8" y="210.5" class="chipt" text-anchor="middle">Neo4j</text><rect x="279.1" y="194" width="70.3" height="24" rx="4" class="chip"/><text x="314.2" y="210.5" class="chipt" text-anchor="middle">FastAPI</text><rect x="357.4" y="194" width="35.8" height="24" rx="4" class="chip"/><text x="375.3" y="210.5" class="chipt" text-anchor="middle">D3</text>
