<svg xmlns="http://www.w3.org/2000/svg" width="440" height="236" viewBox="0 0 440 236" role="img" aria-label="System Design Atlas: Animated, interactive reference for 111 system design concepts with trade-offs, real examples and interview prep.">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".28"/><stop offset=".6" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect width="440" height="236" rx="18"/></clipPath>
    <style>
      .cat{font:700 10.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;letter-spacing:1.6px;fill:#8b5cf6}
      .title{font:800 25px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#f8fafc}
      .desc{font:400 13.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#a8b3c7}
      .hl{font:600 12px 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;fill:#ec4899}
      .chip{fill:#ffffff0d;stroke:#ffffff1f;stroke-width:1}
      .chipt{font:600 11.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#dbe3ef}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="440" height="236" fill="#0b1020"/>
    <rect width="440" height="236" fill="url(#glow)"/>
    <rect width="5" height="236" fill="url(#acc)"/>
  </g>
  <rect x=".5" y=".5" width="439" height="235" rx="17.5" fill="none" stroke="#ffffff1a"/>
  <text x="28" y="38" class="cat">INTERACTIVE REFERENCE</text>
  <rect x="356" y="22" width="58" height="22" rx="11" fill="#10b98122" stroke="#10b981" stroke-width="1"/><circle cx="368" cy="33" r="3.5" fill="#10b981"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle><text x="394" y="37.5" text-anchor="middle" style="font:700 10.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#34d399;letter-spacing:1px">LIVE</text>
  <text x="28" y="74" class="title">System Design Atlas</text>
  <text x="28" y="104" class="desc">Animated, interactive reference for 111 system design</text><text x="28" y="124" class="desc">concepts with trade-offs, real examples and interview</text><text x="28" y="144" class="desc">prep.</text>
  <text x="28" y="174" class="hl">▸ 16 domains · 10 classic systems, step by step</text>
  <rect x="28.0" y="194" width="49.6" height="24" rx="12" class="chip"/><text x="52.8" y="210.5" class="chipt" text-anchor="middle">HTML</text><rect x="85.6" y="194" width="63.4" height="24" rx="12" class="chip"/><text x="117.3" y="210.5" class="chipt" text-anchor="middle">Canvas</text><rect x="157.0" y="194" width="91.0" height="24" rx="12" class="chip"/><text x="202.5" y="210.5" class="chipt" text-anchor="middle">JavaScript</text>
</svg>
