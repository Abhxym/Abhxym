<svg xmlns="http://www.w3.org/2000/svg" width="440" height="236" viewBox="0 0 440 236" role="img" aria-label="System Design Atlas: Animated, interactive reference for 111 system design concepts with trade-offs, real examples and interview prep.">
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".08"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <style>
      .cat{font:700 11px 'Courier New', Consolas, 'Liberation Mono', monospace;letter-spacing:1.5px;fill:#a3a3a3}
      .title{font:800 25px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#ffffff}
      .desc{font:400 13.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#bdbdbd}
      .hl{font:700 12px 'Courier New', Consolas, 'Liberation Mono', monospace;fill:#ffffff}
      .chip{fill:#000;stroke:#ffffff55;stroke-width:1}
      .chipt{font:600 11.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;fill:#e5e5e5}
    </style>
  </defs>
  <rect x=".5" y=".5" width="439" height="235" rx="10" fill="#050505" stroke="#ffffff33"/>
  <rect x=".5" y=".5" width="439" height="235" rx="10" fill="url(#sheen)"/>
  <text x="28" y="38" class="cat">INTERACTIVE REFERENCE</text>
  <rect x="356" y="22" width="58" height="22" rx="4" fill="#ffffff" /><circle cx="368" cy="33" r="3.5" fill="#000"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle><text x="394" y="37.5" text-anchor="middle" style="font:700 10.5px 'Courier New', Consolas, 'Liberation Mono', monospace;fill:#000;letter-spacing:1px">LIVE</text>
  <text x="28" y="74" class="title">System Design Atlas</text>
  <text x="28" y="104" class="desc">Animated, interactive reference for 111 system design</text><text x="28" y="124" class="desc">concepts with trade-offs, real examples and interview</text><text x="28" y="144" class="desc">prep.</text>
  <text x="28" y="174" class="hl">&gt; 16 domains · 10 classic systems, step by step</text>
  <rect x="28.0" y="194" width="49.6" height="24" rx="4" class="chip"/><text x="52.8" y="210.5" class="chipt" text-anchor="middle">HTML</text><rect x="85.6" y="194" width="63.4" height="24" rx="4" class="chip"/><text x="117.3" y="210.5" class="chipt" text-anchor="middle">Canvas</text><rect x="157.0" y="194" width="91.0" height="24" rx="4" class="chip"/><text x="202.5" y="210.5" class="chipt" text-anchor="middle">JavaScript</text>
</svg>
